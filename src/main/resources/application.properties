spring.application.name=PulseAI
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================================================
# FILE UPLOAD SIZE LIMITS (default 1MB is too small for photos)
# ===============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================================================
# PRIMARY PERSISTENT DATABASE (LOCAL POSTGRESQL-COMPATIBLE H2)
# Stores data in ./data/socialdb.mv.db across application restarts
# Works immediately offline without network or paused tenant errors
# ===============================================================
spring.datasource.url=jdbc:h2:file:./data/socialdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ============================================================
# PRODUCTION PROFILE — used when SPRING_PROFILES_ACTIVE=prod
# Railway sets PORT env variable automatically
# ============================================================
server.port=${PORT:8081}
server.error.include-message=never
server.error.include-binding-errors=never

# ── Database ─────────────────────────────────────────────────
# H2 file DB stored in /app/data inside the container
spring.datasource.url=jdbc:h2:file:/app/data/socialdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 web console in production (security)
spring.h2.console.enabled=false

# ── File Uploads ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── NLP Microservice (disabled in prod by default) ───────────
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ── Supabase (optional cloud storage) ────────────────────────
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=PublicMedia

